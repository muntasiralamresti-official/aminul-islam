<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aminul Islam — Offline</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827;display:grid;min-height:100vh;place-items:center}
    .card{max-width:420px;margin:24px;padding:32px;border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
    .icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:26px}
    h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#6b7280;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">↯</div>
    <h1>You are offline</h1>
    <p>Aminul Islam can still show previously cached pages and data. Reconnect to the internet to save new changes.</p>
  </main>
</body>
</html>
